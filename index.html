<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口袋巡遊 Pocket Walker</title>
<style>
:root{--panel:#fffaf0;--ink:#1b2a2f;--mute:#5d6f72;--accent:#e8892b;--ok:#2f9e6b;--line:#d8cfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#15292c;--ink:#f2ead8;--mute:#9db1b0;--line:#2b4549}}
:root[data-theme="dark"]{--panel:#15292c;--ink:#f2ead8;--mute:#9db1b0;--line:#2b4549}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#2e5b4a;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-radius:14px;padding:8px 12px;min-width:170px;box-shadow:0 2px 0 var(--line)}
.hud b{font-size:15px}.bar{height:7px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.hud small{color:var(--mute);display:block;margin-top:4px}
#mm{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:96px;height:96px;border-radius:50%;border:3px solid var(--panel);background:#264a3c}
.dock{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:10px 14px;box-shadow:0 2px 0 var(--line);cursor:pointer}
button:active{transform:translateY(1px)}button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--accent)}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;font-weight:700;display:none;padding:12px 20px}
#joy{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,250,240,.25);border:2px solid rgba(255,250,240,.5)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--panel)}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.ov{position:fixed;inset:0;background:rgba(10,25,25,.7);display:none;align-items:center;justify-content:center;padding:14px}
.card{background:var(--panel);border-radius:20px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto;text-align:center}
.card h2{margin:0 0 4px;font-size:20px}
#cr{font-size:84px;line-height:1.1;transition:transform .3s}
.stage{position:relative;height:170px;display:flex;align-items:center;justify-content:center}
#ring{position:absolute;width:150px;height:150px;border:3px dashed var(--ok);border-radius:50%}
#inner{position:absolute;width:150px;height:150px;border:4px solid var(--accent);border-radius:50%}
#ball{position:absolute;bottom:-6px;font-size:36px;display:none}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
.shake{animation:shake .5s 2;display:block!important}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.row button.sel{background:var(--accent);color:#fff}
#msg{min-height:22px;font-weight:600;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.cell{background:var(--bg,transparent);border:1px solid var(--line);border-radius:12px;padding:6px 2px;font-size:11px;color:var(--mute)}
.cell span{display:block;font-size:30px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="lv"></b><div class="bar"><i id="xpb"></i></div><small id="stat"></small></div>
<canvas id="mm" width="96" height="96"></canvas>
<button id="act"></button>
<div id="joy"><div id="knob"></div></div>
<div class="dock"><button id="bBag">🎒 背包</button><button id="bDex">📖 圖鑑</button></div>
<div id="toast"></div>

<div class="ov" id="encOv"><div class="card">
  <h2 id="en"></h2><div id="ecp" style="color:var(--mute)"></div>
  <div class="stage"><div id="ring"></div><div id="inner"></div><div id="cr"></div><div id="ball">🔴</div></div>
  <div id="msg"></div>
  <div class="row" id="balls"></div>
  <div class="row"><button id="bBerry"></button><button id="bThrow" style="background:var(--accent);color:#fff;font-weight:700">投球！</button><button id="bRun">逃跑</button></div>
  <small style="color:var(--mute)">圓圈縮到最小時投球，命中率更高</small>
</div></div>

<div class="ov" id="bagOv"><div class="card"><h2>🎒 背包</h2><div id="bagList"></div><div class="row"><button id="bagX">關閉</button></div></div></div>
<div class="ov" id="dexOv"><div class="card"><h2>📖 圖鑑</h2><div id="dexSum" style="color:var(--mute)"></div><div class="grid" id="dexG"></div><div class="row"><button id="dexX">關閉</button></div></div></div>

<script>
const $=i=>document.getElementById(i), cv=$('c'), g=cv.getContext('2d'), mm=$('mm'), mg=mm.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const WORLD=3000, SPD=150;
// 物種: emoji, 名稱, 基礎捕獲率, 出現權重, 最低等級
const SP=[['🐛','綠綠蟲',.65,10,1],['🐭','灰灰鼠',.6,10,1],['🐦','啾啾鳥',.55,8,1],['🐸','圓圓蛙',.5,8,1],['🐢','殼殼龜',.4,6,2],['🦊','火尾狐',.35,5,2],['🦉','夜眼鴞',.28,4,3],['🐙','墨墨章',.22,3,4],['🐉','小青龍',.14,1.5,5],['🦄','星角獸',.1,1,6]];
const BALLS=[['普通球','⚪',1],['高級球','🔵',1.5],['超級球','🟡',2]];
// 存檔
let S={xp:0,b:[15,0,0],berry:3,lure:0,lureEnd:0,dex:{},caught:0,cd:{}};
try{const s=JSON.parse(localStorage.getItem('pw1'));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('pw1',JSON.stringify(S))}catch(e){}};
const lvOf=()=>Math.floor(Math.sqrt(S.xp/100))+1;
// 世界(固定種子)
let sd=7;const R=()=>(sd=sd*16807%2147483647)/2147483647;
const stations=[{x:1580,y:1440}],ponds=[],trees=[];
for(let i=0;i<26;i++)stations.push({x:150+R()*(WORLD-300),y:150+R()*(WORLD-300)});
for(let i=0;i<14;i++)ponds.push({x:100+R()*(WORLD-200),y:100+R()*(WORLD-200),r:50+R()*70});
for(let i=0;i<420;i++){const x=R()*WORLD,y=R()*WORLD;if(x%500<40||y%500<40)continue;if(ponds.some(p=>Math.hypot(p.x-x,p.y-y)<p.r+15))continue;trees.push({x,y,s:24+R()*14})}
const P={x:1500,y:1500,face:1}, mons=[];let enc=null, last=performance.now(), spawnT=0;
const keys={}, jv={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
// 搖桿
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+60),dy=e.clientY-(r.top+60),d=Math.min(1,Math.hypot(dx,dy)/55),a=Math.atan2(dy,dx);jv.x=Math.cos(a)*d;jv.y=Math.sin(a)*d;knob.style.transform=`translate(${jv.x*40}px,${jv.y*40}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
['pointerup','pointercancel'].forEach(t=>joy.addEventListener(t,()=>{jid=null;jv.x=jv.y=0;knob.style.transform=''}));
// 工具
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function hud(){const l=lvOf(),a=(l-1)**2*100,b=l*l*100;$('lv').textContent='訓練師 Lv.'+l;$('xpb').style.width=((S.xp-a)/(b-a)*100)+'%';
 const lure=S.lureEnd>Date.now()?' ｜ 🕯️誘餌 '+fmt((S.lureEnd-Date.now())/1000):'';$('stat').textContent='已捕獲 '+S.caught+' 隻 ｜ 球 '+(S.b[0]+S.b[1]+S.b[2])+lure}
function addXp(n){const o=lvOf();S.xp+=n;if(lvOf()>o)toast('🎉 升級了！Lv.'+lvOf()+'，更稀有的寶可夢出現了');}
// 生成
function spawn(){const l=lvOf(),pool=SP.map((s,i)=>[i,s]).filter(([i,s])=>s[4]<=l);let t=pool.reduce((a,[i,s])=>a+s[3],0)*R2(),id=0;
 for(const [i,s] of pool){t-=s[3];if(t<=0){id=i;break}}
 const a=Math.random()*6.283,d=130+Math.random()*320,sp=SP[id];
 mons.push({id,x:Math.max(30,Math.min(WORLD-30,P.x+Math.cos(a)*d)),y:Math.max(30,Math.min(WORLD-30,P.y+Math.sin(a)*d)),ttl:120,cp:Math.round((20+Math.random()*80)*(1.6-sp[2])*(1+l*.3)),ig:0})}
const R2=()=>Math.random();
// 更新
function update(dt){
 let vx=jv.x,vy=jv.y;
 if(keys.arrowleft||keys.a)vx-=1;if(keys.arrowright||keys.d)vx+=1;if(keys.arrowup||keys.w)vy-=1;if(keys.arrowdown||keys.s)vy+=1;
 const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
 P.x=Math.max(10,Math.min(WORLD-10,P.x+vx*SPD*dt));P.y=Math.max(10,Math.min(WORLD-10,P.y+vy*SPD*dt));if(vx)P.face=vx<0?-1:1;
 for(const p of ponds){const d=Math.hypot(P.x-p.x,P.y-p.y);if(d<p.r+10){P.x=p.x+(P.x-p.x)/d*(p.r+10);P.y=p.y+(P.y-p.y)/d*(p.r+10)}}
 const lure=S.lureEnd>Date.now();spawnT-=dt;
 if(spawnT<=0){spawnT=lure?.6:2;if(mons.length<(lure?20:9))spawn()}
 for(let i=mons.length-1;i>=0;i--){const o=mons[i];o.ttl-=dt;o.ig-=dt;if(o.ttl<=0||Math.hypot(o.x-P.x,o.y-P.y)>750)mons.splice(i,1);
  else if(o.ig<=0&&Math.hypot(o.x-P.x,o.y-P.y)<34){startEnc(o);break}}
 // 補給站按鈕
 let near=null;for(const s of stations)if(Math.hypot(s.x-P.x,s.y-P.y)<60)near=s;
 const b=$('act');
 if(near){const i=stations.indexOf(near),left=(S.cd[i]||0)-Date.now();b.style.display='block';b.disabled=left>0;b.textContent=left>0?'補給中 '+fmt(left/1000):'🎁 領取補給';b.onclick=()=>spin(i)}else b.style.display='none';
}
const COOL=90000;
function spin(i){if((S.cd[i]||0)>Date.now())return;S.cd[i]=Date.now()+COOL;const l=lvOf(),got=[];
 const n=3+Math.floor(Math.random()*4);S.b[0]+=n;got.push('普通球 ×'+n);
 if(Math.random()<.5){const k=1+Math.floor(Math.random()*2);S.berry+=k;got.push('🍓樹果 ×'+k)}
 if(Math.random()<.35){const k=1+Math.floor(Math.random()*2);S.b[1]+=k;got.push('高級球 ×'+k)}
 if(l>=4&&Math.random()<.2){S.b[2]+=1;got.push('超級球 ×1')}
 if(Math.random()<.12){S.lure++;got.push('🕯️誘餌 ×1')}
 addXp(50);save();hud();toast('獲得：'+got.join('、')+'（+50 XP）')}
// 繪製
function em(t,x,y,s){g.font=s+'px serif';g.fillText(t,x,y)}
function draw(now){
 g.fillStyle='#2e5b4a';g.fillRect(0,0,W,H);
 const cx=P.x-W/2,cy=P.y-H/2;g.save();g.translate(-cx,-cy);
 g.fillStyle='rgba(235,220,170,.22)';for(let k=0;k<=WORLD;k+=500){g.fillRect(k-14,0,28,WORLD);g.fillRect(0,k-14,WORLD,28)}
 g.strokeStyle='rgba(255,255,255,.05)';g.beginPath();for(let x=Math.floor(cx/100)*100;x<cx+W;x+=100){g.moveTo(x,cy);g.lineTo(x,cy+H)}for(let y=Math.floor(cy/100)*100;y<cy+H;y+=100){g.moveTo(cx,y);g.lineTo(cx+W,y)}g.stroke();
 g.textAlign='center';g.textBaseline='middle';
 for(const p of ponds){if(p.x+p.r<cx||p.x-p.r>cx+W||p.y+p.r<cy||p.y-p.r>cy+H)continue;g.fillStyle='#3b8ec2';g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.stroke()}
 for(const t of trees)if(t.x>cx-40&&t.x<cx+W+40&&t.y>cy-40&&t.y<cy+H+40)em('🌲',t.x,t.y,t.s*1.5);
 for(const s of stations){if(s.x<cx-80||s.x>cx+W+80||s.y<cy-80||s.y>cy+H+80)continue;const i=stations.indexOf(s),rdy=(S.cd[i]||0)<Date.now();
  g.fillStyle=rdy?'rgba(70,170,255,.25)':'rgba(150,100,210,.2)';g.beginPath();g.arc(s.x,s.y,60,0,6.283);g.fill();
  g.fillStyle=rdy?'#2f86d6':'#8a63c7';g.beginPath();g.arc(s.x,s.y,20,0,6.283);g.fill();em('🎁',s.x,s.y+1,22)}
 for(const o of mons){const b=Math.sin(now/300+o.x)*3;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(o.x,o.y+18,16,6,0,0,6.283);g.fill();em(SP[o.id][0],o.x,o.y+b,34)}
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(P.x,P.y+17,14,5,0,0,6.283);g.fill();
 g.save();g.translate(P.x,P.y);g.scale(P.face,1);em('🧑‍🎒',0,0,34);g.restore();
 g.restore();
 // 小地圖
 mg.clearRect(0,0,96,96);mg.fillStyle='#264a3c';mg.fillRect(0,0,96,96);const sc=48/700;
 for(const s of stations){const dx=(s.x-P.x)*sc,dy=(s.y-P.y)*sc;if(Math.hypot(dx,dy)<46){mg.fillStyle=(S.cd[stations.indexOf(s)]||0)<Date.now()?'#4aa8ff':'#8a63c7';mg.fillRect(48+dx-3,48+dy-3,6,6)}}
 for(const o of mons){const dx=(o.x-P.x)*sc,dy=(o.y-P.y)*sc;if(Math.hypot(dx,dy)<46){mg.fillStyle='#ffb347';mg.beginPath();mg.arc(48+dx,48+dy,2.5,0,6.283);mg.fill()}}
 mg.fillStyle='#fff';mg.beginPath();mg.arc(48,48,4,0,6.283);mg.fill();
}
// 遭遇
function startEnc(o){enc={o,sp:SP[o.id],ball:S.b[0]?0:S.b[1]?1:2,berry:false,busy:false,sc:1};
 $('en').textContent=enc.sp[1];$('ecp').textContent='CP '+o.cp;$('cr').textContent=enc.sp[0];$('cr').style.transform='';$('msg').textContent='野生的 '+enc.sp[1]+' 出現了！';$('encOv').style.display='flex';jv.x=jv.y=0;knob.style.transform='';encUi()}
function encUi(){const r=$('balls');r.innerHTML='';BALLS.forEach((b,i)=>{const e=document.createElement('button');e.textContent=b[1]+' '+b[0]+' ×'+S.b[i];e.className=enc.ball===i?'sel':'';e.onclick=()=>{if(!enc.busy){enc.ball=i;encUi()}};r.appendChild(e)});
 const bb=$('bBerry');bb.textContent='🍓樹果 ×'+S.berry+(enc.berry?' ✔':'');bb.className=enc.berry?'sel':''}
$('bBerry').onclick=()=>{if(enc.busy)return;if(!enc.berry&&S.berry<1)return toast('沒有樹果了');enc.berry=!enc.berry;encUi()};
$('bRun').onclick=()=>{if(enc.busy)return;enc.o.ig=10;endEnc()};
function endEnc(){enc=null;$('encOv').style.display='none';hud();save()}
$('bThrow').onclick=()=>{if(!enc||enc.busy)return;if(S.b[enc.ball]<1){$('msg').textContent='這種球用完了！換別的球，或去補給站補充。';if(S.b[0]+S.b[1]+S.b[2]<1)$('msg').textContent='球用光了！先逃跑，去補給站補充吧。';return}
 enc.busy=true;S.b[enc.ball]--;let bonus=1,tag='普通';if(enc.sc<.5){bonus=1.8;tag='Excellent！'}else if(enc.sc<.75){bonus=1.4;tag='Great！'}else if(enc.sc<.95){bonus=1.15;tag='Nice！'}
 if(enc.berry){S.berry--;}const p=Math.min(.95,enc.sp[2]*BALLS[enc.ball][2]*(enc.berry?1.5:1)*bonus*(1-enc.o.cp/1500)),ok=Math.random()<p;
 $('msg').textContent=bonus>1?tag:'投出去了…';$('cr').style.transform='scale(.3)';const b=$('ball');b.className='';void b.offsetWidth;b.className='shake';
 setTimeout(()=>{b.className='';
  if(ok){const bx=Math.round(100*bonus);S.caught++;S.dex[enc.o.id]=(S.dex[enc.o.id]||0)+1;addXp(bx);const i=mons.indexOf(enc.o);if(i>=0)mons.splice(i,1);
   $('msg').textContent='🎉 捕獲成功！獲得 '+bx+' XP';hud();save();setTimeout(endEnc,1400)}
  else{$('cr').style.transform='';enc.berry=false;
   if(Math.random()<.12+(1-enc.sp[2])*.2){$('msg').textContent='💨 '+enc.sp[1]+' 逃走了…';const i=mons.indexOf(enc.o);if(i>=0)mons.splice(i,1);save();setTimeout(endEnc,1300)}
   else{$('msg').textContent='糟糕，它掙脫了！再試一次。';enc.busy=false;encUi();save()}}},1300)};
// 背包 / 圖鑑
const show=(id,v)=>$(id).style.display=v?'flex':'none';
function bag(){const L=$('bagList'),rows=[['⚪ 普通球',S.b[0]],['🔵 高級球',S.b[1]],['🟡 超級球',S.b[2]],['🍓 樹果',S.berry],['🕯️ 誘餌',S.lure]];
 L.innerHTML=rows.map(r=>`<div class="item"><span>${r[0]}</span><b>×${r[1]}</b></div>`).join('');
 const act=S.lureEnd>Date.now(),d=document.createElement('div');d.className='row';const u=document.createElement('button');u.textContent=act?'誘餌效果中…':'使用誘餌（5 分鐘，吸引更多寶可夢）';u.disabled=act||S.lure<1;
 u.onclick=()=>{S.lure--;S.lureEnd=Date.now()+300000;save();hud();bag();toast('誘餌生效，周圍的寶可夢變多了！')};d.appendChild(u);L.appendChild(d)}
$('bBag').onclick=()=>{bag();show('bagOv',1)};$('bagX').onclick=()=>show('bagOv',0);
$('bDex').onclick=()=>{const n=Object.keys(S.dex).length;$('dexSum').textContent='已收集 '+n+' / '+SP.length+' 種，共捕獲 '+S.caught+' 隻';
 $('dexG').innerHTML=SP.map((s,i)=>S.dex[i]?`<div class="cell"><span>${s[0]}</span>${s[1]}<br>×${S.dex[i]}</div>`:`<div class="cell"><span>❔</span>未發現</div>`).join('');show('dexOv',1)};
$('dexX').onclick=()=>show('dexOv',0);
// 主迴圈
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(enc){enc.sc=.3+.7*(.5+.5*Math.sin(now/420));$('inner').style.transform='scale('+enc.sc+')'}else update(dt);
 draw(now);requestAnimationFrame(loop)}
hud();setInterval(hud,1000);for(let i=0;i<5;i++)spawn();
requestAnimationFrame(loop);
toast('用搖桿或 WASD／方向鍵移動，靠近 🎁 領補給');
</script>
</body>
</html>
